version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: aatransport_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_123}
      POSTGRES_DB: ${POSTGRES_DB:-roster_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-roster_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aatransport_redis
    restart: always
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backendnest
      dockerfile: Dockerfile
    container_name: aatransport_backend
    restart: always
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass_123}@postgres:5432/${POSTGRES_DB:-roster_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:-aatransport_jwt_secret_key_change_in_production}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-aatransport_jwt_refresh_secret_key_change_in_production}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SUPERVISOR_PIN=${SUPERVISOR_PIN:-1234}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  recognition:
    build:
      context: ./recognition-service
      dockerfile: Dockerfile
    container_name: aatransport_recognition
    restart: always
    environment:
      - NESTJS_API_URL=http://backend:4000/api/v1
    ports:
      - "8000:8000"
    depends_on:
      - backend

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-/}
    container_name: aatransport_front
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: aatransport_nginx
    restart: always
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - front
      - backend
      - recognition

volumes:
  postgres_data:
  redis_data:
